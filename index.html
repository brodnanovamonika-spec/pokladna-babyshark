<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B1F3A">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Pokladňa detského ihriska Baby Shark">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Pokladňa Baby Shark">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Pokladňa Baby Shark</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Offline app shell: web/sw.js (filled in by tool/build_sw.py at publish time). -->
  <script>
    if ('serviceWorker' in navigator) {
      // A new version takes over while the page runs the old one: offer a refresh instead of
      // reloading by itself (an open sale must not be lost).
      var hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!hadController || document.getElementById('pokladna-update')) return;
        var bar = document.createElement('div');
        bar.id = 'pokladna-update';
        bar.style.cssText = 'position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:99999;' +
          'background:#12162e;color:#fff;font:600 14px Manrope,system-ui,sans-serif;padding:10px 12px 10px 18px;' +
          'border-radius:999px;box-shadow:0 8px 28px rgba(0,0,0,.28);display:flex;align-items:center;gap:12px';
        bar.textContent = 'Je dostupná nová verzia pokladne';
        var btn = document.createElement('button');
        btn.textContent = 'Obnoviť';
        btn.style.cssText = 'border:0;border-radius:999px;background:#4776ba;color:#fff;font:700 14px inherit;padding:8px 16px;cursor:pointer';
        btn.onclick = function () { location.reload(); };
        bar.appendChild(btn);
        document.body.appendChild(bar);
      });
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('sw', e); });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
